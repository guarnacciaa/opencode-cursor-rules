pre-commit:
  parallel: true
  commands:
    biome-check:
      glob: "*.{ts}"
      run: npx biome check --write --staged --no-errors-on-unmatched {staged_files}
    biome-format:
      glob: "*.{ts}"
      run: npx biome format --write --staged --no-errors-on-unmatched {staged_files}

commit-msg:
  commands:
    commitlint:
      run: npx commitlint --edit {1}
